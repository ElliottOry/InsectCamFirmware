# next time these need sizing.  Re-measure by temporarily adding
# CONFIG_THREAD_NAME/THREAD_ANALYZER/THREAD_ANALYZER_AUTO:
#   BT RX WQ 1016/2048   main 920/1152   ble_stream 776/2048  sysworkq 784/2048
