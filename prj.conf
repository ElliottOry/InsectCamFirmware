# Camera register access over TWIM0 (i2c0, DT alias "hmm").
CONFIG_I2C=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y

# Drivers report transport/init failures through the logging subsystem.
# Immediate mode keeps their output interleaved in order with the printk()
# status lines rather than being flushed later out of sequence.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Console goes out over SEGGER RTT on the J-Link; uart0 is disabled in the
# board DTS (its pins now carry the camera's HSYNC/VSYNC).
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# MCLK generation for the HM01B0: TIMER3 -> PPI -> GPIOTE toggle on P0.18.
# The sensor's register block is clocked from MCLK, so this must run before I2C.
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPIOTE=y
CONFIG_NRFX_GPPI=y

# Pixel capture: the camera masters SPIS2 (PCLKO=SCK, D0=MOSI, LVLD=CSN).
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y

# k_malloc pool for the per-frame frame_item_t handed from capture to BLE.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Battery: while no central is connected, the capture/IMU/stream threads block
# on a k_event posted by the BLE connected callback (ble_manager.c) instead of
# polling, so the SoC sits in System ON idle between advertising events.
CONFIG_EVENTS=y

# BLE peripheral. The receiver (save_to_file_bt.py) scans for this exact name.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="insect_cam"
CONFIG_BT_MAX_CONN=1

# Radio output power. +4 dBm is the maximum both the nRF52832 and the ES2832
# module support (datasheet 4.3: PRF typ 4 dBm), and the module is FCC/IC
# certified across its full power-control range, so this needs no re-cert.
#
# This build uses the SoftDevice Controller (CONFIG_BT_LL_SOFTDEVICE=y), not
# Zephyr's software link layer, so it is worth recording how this symbol
# actually reaches the radio: nrf/subsys/bluetooth/controller/radio_nrf5_txp.h
# maps the BT_CTLR_TX_PWR_* choice to RADIO_TXP_DEFAULT, and hci_driver.c calls
# sdc_default_tx_power_set(RADIO_TXP_DEFAULT) -- but only under
# `#if RADIO_TXP_DEFAULT != 0`. At the previous default (TX_PWR_0) that call
# compiled out entirely and the controller ran its own 0 dBm default, so the
# setting was invisible in a disassembly and easy to mistake for "unset".
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# ble_manager.c registers .le_phy_updated/.le_data_len_updated callbacks,
# which only exist under the USER_* options. Enabling USER_* flips the
# AUTO_* defaults to n, so force them back on: the host must keep negotiating
# PHY/DLE itself — driving the PHY manually crashes this controller.
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y

# Throughput: 244-byte notification payloads (ble_stage[244] in ble_manager.c)
# need ATT MTU 247 and 251-byte LL payloads end to end.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Connection-parameter retries and re-advertise run as delayable work items
# that call into the BT host; the 1 KB default workqueue stack is marginal.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# The GATT write callback (on_rx_received) runs on the BT host RX thread, and
# with LOG_MODE_IMMEDIATE every printk formats the message and writes RTT on
# THAT thread's stack (~400 B for a two-arg message on Cortex-M3, more with 7).
# The 1 KB default overflowed into the MPU guard on the multi-arg link-info
# printk after a stream-start write. Nordic known issue DRGN-17695.
CONFIG_BT_RX_STACK_SIZE=2048

# main() never returns (it runs stream_photos()) and printks from there.  The
# thread analyzer measured a 920 B peak against the 1128 B default -- 232 B of
# headroom, the thinnest margin in the system once BT RX was fixed.
CONFIG_MAIN_STACK_SIZE=1536

